name: Backup Database

# Weekly full pg_dump of the Supabase database, pushed to a separate private
# backup repo. Supabase's free tier has no automatic backups at all, so this
# is the only safety net if the database is ever lost or corrupted.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL   - the direct Postgres connection string from
#                        Supabase (Settings -> Database), not the pooler URL
#   BACKUP_REPO_TOKEN - a GitHub personal access token with push access to
#                        the backup repo (the default Actions token can't
#                        push to a repo other than the one it runs in)

on:
  schedule:
    # Tuesday 10:00 UTC (~5-6am ET) - after Monday Night Football wraps,
    # before anyone's usually awake to use the app.
    - cron: '0 10 * * 2'
  workflow_dispatch: {} # allows manually triggering a backup from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's default postgresql-client is v16, but Supabase runs Postgres
      # 17 — pg_dump refuses to dump from a newer server by default, so pull
      # a matching client from PostgreSQL's own apt repo instead.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges > backup.sql
          # Guard against a silently-empty dump (e.g. pg_dump errored but the
          # old pipe-to-gzip version masked it) — a real dump is never this small.
          size=$(stat -c%s backup.sql)
          if [ "$size" -lt 1000 ]; then
            echo "::error::pg_dump produced a suspiciously small file (${size} bytes) — treating as a failure."
            cat backup.sql
            exit 1
          fi
          gzip backup.sql

      - name: Push backup to private repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/ejphill/football-picks-backups.git" backups
          DATE=$(date +%F)
          cp backup.sql.gz "backups/backup-${DATE}.sql.gz"
          cd backups
          git config user.name "football-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "backup-${DATE}.sql.gz"
          git commit -m "Backup ${DATE}" || echo "nothing changed, skipping commit"
          git push
